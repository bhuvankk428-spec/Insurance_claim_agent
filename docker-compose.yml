services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      CHAT_PORT: 5174
      CLAIM_PORT: 5175
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "5174:5174"
      - "5175:5175"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_CHAT_API_URL: http://localhost:5174
        VITE_CLAIM_API_URL: http://localhost:5175
        VITE_API_URL: http://localhost:5175
    ports:
      - "5173:5173"
    depends_on:
      - backend
